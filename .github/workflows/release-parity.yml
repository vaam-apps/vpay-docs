name: release-parity

# Each time vpay tags a release, ask: are these pages still true of it?
#
# vpay's own release is never blocked by the answer. Its images, chart and
# SDKs publish from vpay's release.yml whatever happens here. What this
# workflow does when the answer is "no" is REPORT: the job goes red, the step
# summary carries the parity report, and one issue per release lists every
# page whose vpay sources changed and every vpay page that has no page here.
# A person closes that gap and bumps vpay.lock.json. The lock is never bumped
# automatically, because "the files still exist" is not "the pages are true".
#
# Triggers: a poll (vpay needs no token for this repository), a manual run for
# any tag, and `repository_dispatch: vpay-release` so vpay's release.yml CAN
# notify this immediately if someone later gives it a token to do so. Nothing
# depends on that dispatch; the poll is the mechanism.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "vpay tag to check (default: vpay's latest release)"
        required: false
  repository_dispatch:
    types: [vpay-release]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  parity:
    name: parity with vpay's latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vpay-docs
          persist-credentials: false

      - name: Resolve the release to check
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never inlined: both are caller-supplied text.
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo vaam-apps/vpay --json tagName --jq .tagName)"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z tag"; exit 2
          fi
          locked="$(jq -r .vpay.tag vpay-docs/vpay.lock.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$locked" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "### vpay-docs is verified against vpay $tag, the latest release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close parity issues the lock has caught up with
        if: steps.target.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED: ${{ steps.target.outputs.locked }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --label parity --state open \
            --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "vpay.lock.json now names $LOCKED, vpay's latest release. Closing."
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.current == 'false'
        with:
          repository: vaam-apps/vpay
          ref: ${{ steps.target.outputs.tag }}
          path: vpay
          # The release check diffs the locked tag against the new one, so both
          # must be in the clone.
          fetch-depth: 0
          persist-credentials: false

      # vpay-skills at main, not at the locked ref: a skill added since the
      # last bump is exactly what this run should surface.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.current == 'false'
        with:
          repository: vaam-apps/vpay-skills
          path: vpay-skills
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.target.outputs.current == 'false'
        with:
          package_json_file: vpay-docs/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.target.outputs.current == 'false'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: vpay-docs/pnpm-lock.yaml
      - if: steps.target.outputs.current == 'false'
        run: pnpm install --frozen-lockfile
        working-directory: vpay-docs

      - name: verify-parity --release
        id: gate
        if: steps.target.outputs.current == 'false'
        working-directory: vpay-docs
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set +e
          node tools/verify-parity.mjs --vpay ../vpay --skills ../vpay-skills \
            --release "$TAG" --report parity-report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat parity-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the release's parity issue
        if: steps.target.outputs.current == 'false'
        working-directory: vpay-docs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          set -euo pipefail
          title="Parity with vpay $TAG"
          {
            echo "vpay released [\`$TAG\`](https://github.com/vaam-apps/vpay/releases/tag/$TAG). These pages are still verified against an older release, so this issue lists what that release changed under them."
            echo
            echo "**To close it:** re-read each stale page against vpay at \`$TAG\`, add a page for each uncovered vpay path, bump \`vpay.lock.json\` (and \`skills.ref\`, if vpay-skills moved), and open a PR. This issue closes on the first scheduled run after that merges."
            echo
            cat parity-report.md
            echo
            echo "_Last checked by [this run]($RUN_URL)._"
          } > issue.md
          gh label create parity --repo "$GITHUB_REPOSITORY" --color B45309 \
            --description "vpay-docs is behind a vpay release" --force
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label parity --state open \
                 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label parity --body-file issue.md
          fi

      - name: Fail while the docs are behind
        if: steps.target.outputs.current == 'false'
        env:
          CODE: ${{ steps.gate.outputs.exit }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          echo "::error::vpay-docs is not verified against vpay $TAG (verify-parity exit $CODE). vpay's release was not blocked; see the parity issue."
          exit 1
